<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Mis ojitos bonitos 🤎
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="app">


        <!-- =====================================================
             MÚSICA
        ====================================================== -->

        <audio
            id="background-music"
            preload="auto"
        >

            <source
                src="Río Roma - Tan Sólo un Minuto (Cover Audio).mp3"
                type="audio/mpeg"
            >

        </audio>


        <button
            class="music-control"
            id="music-control"
            type="button"
        >
            ♫
        </button>



        <!-- =====================================================
             TERMINAL
        ====================================================== -->

        <section class="terminal">

            <div class="terminal-header">

                <div class="terminal-buttons">

                    <span class="btn red"></span>

                    <span class="btn yellow"></span>

                    <span class="btn green"></span>

                </div>


                <span class="terminal-title">
                    dedicatoria.exe
                </span>

            </div>


            <div
                class="terminal-body"
                id="terminal-body"
            ></div>

        </section>



        <!-- =====================================================
             ESCENA DE FLORES
        ====================================================== -->

        <section class="flower-scene">


            <div class="flower-content">


                <div class="flower-status">

                    <span>
                        Preparando algo especial
                    </span>

                    <span class="loading-dots"></span>

                </div>


                <div
                    class="generation-status"
                    id="generation-status"
                ></div>


                <div
                    class="love-message"
                    id="love-message"
                ></div>


            </div>



            <div
                class="particles"
                id="particles"
            ></div>



            <div
                class="garden"
                id="garden"
            ></div>


        </section>



        <!-- =====================================================
             ESCENA FINAL
        ====================================================== -->

        <section
            class="tulip-scene"
            id="tulip-scene"
        >


            <div class="tulip-night"></div>



            <!-- =================================================
                 RAMO
            ================================================== -->

            <div class="tulip-final-garden">

                <div
                    class="final-bouquet"
                    id="final-bouquet"
                ></div>

            </div>



            <!-- =================================================
                 CARTA
            ================================================== -->

            <div
                class="letter-container"
                id="letter-container"
            >


                <div class="letter">


                    <div class="letter-paper">


                        <div class="letter-content">


                            <div class="letter-title">

                                Para mis ojitos bonitos 🤎

                            </div>



                            <div
                                class="letter-text"
                                id="letter-text"
                            ></div>



                            <div
                                class="letter-signature"
                                id="letter-signature"
                            >

                                Con cariño 🤎

                            </div>


                        </div>


                    </div>


                </div>


            </div>


        </section>


    </main>



    <script src="app.js"></script>

</body>

</html>
